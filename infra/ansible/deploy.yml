# Puts the app on the server, starts it and schedules the daily jobs. To bring existing
# data to a new server, restore the backups afterwards (see docs/deployment.md).
- name: Deploy the app
  hosts: radar
  remote_user: deploy
  vars:
    app_dir: /home/deploy/radar-empleo-ia
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Get the code
      ansible.builtin.git:
        repo: https://github.com/telloso/radar-empleo-ia.git
        dest: "{{ app_dir }}"
        version: main

    # These two are not in Git: they travel from this machine over SSH.
    - name: Copy the secrets
      ansible.builtin.copy:
        src: "{{ repo_root }}/.env"
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Copy the private profile
      ansible.builtin.copy:
        src: "{{ repo_root }}/collector/profile.md"
        dest: "{{ app_dir }}/collector/profile.md"
        mode: "0600"

    # All the job services share this image, so building one is enough. Docker's
    # layer cache makes a repeat build fast and harmless, but its output gives no
    # reliable signal of change, so it is never reported as changed.
    - name: Build the job image
      ansible.builtin.command:
        cmd: docker compose build collector
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Start the database and n8n
      ansible.builtin.command:
        cmd: docker compose up -d --wait db n8n
        chdir: "{{ app_dir }}"
      register: app_up
      changed_when: "'Started' in app_up.stderr or 'Recreated' in app_up.stderr"

    - name: Install the backup script
      become: true
      ansible.builtin.copy:
        src: radar-backup.sh
        dest: /usr/local/bin/radar-backup.sh
        mode: "0755"

    - name: Install the scheduled jobs
      become: true
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - radar-jobs.service
        - radar-jobs.timer
        - radar-backup.service
        - radar-backup.timer
        - radar-alert.service
      notify: Reload systemd

    - name: Run the handlers now, so the timers start with the new units
      ansible.builtin.meta: flush_handlers

    - name: Turn on the timers
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - radar-jobs.timer
        - radar-backup.timer

  handlers:
    - name: Reload systemd
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true
