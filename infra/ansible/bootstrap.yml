# First run only, as root: creates the admin user that server.yml connects with.
# server.yml then disables root login, so this playbook cannot run a second time.
- name: Create the admin user
  hosts: radar
  remote_user: root
  tasks:
    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash

    - name: Install the SSH public key
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/radar_vps.pub') }}"

    # The account has no password, so sudo cannot ask for one. SSH keys are the
    # only way in.
    - name: Allow deploy to use sudo
      ansible.builtin.copy:
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/deploy
        mode: "0440"
        validate: visudo -cf %s
