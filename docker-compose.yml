services:
  db:
    # Official Postgres 17 plus the pgvector extension, used for similarity search.
    # Trixie (Debian 13) like the old postgres:17 image: same glibc, so the text
    # indexes built with it keep their sort order (no collation mismatch).
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  # Batch job, not a server: it runs once and exits. The "jobs" profile keeps
  # it out of `docker compose up`; start it with `docker compose run --rm collector`.
  collector:
    build: ./collector
    image: radar-collector
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      COLLECTOR_SEARCH: ${COLLECTOR_SEARCH:-python}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # Same image as the collector, different command: scores the jobs that have no
  # score yet. Start it with `docker compose run --rm scorer`.
  scorer:
    build: ./collector
    image: radar-collector
    command: ["python", "scorer.py"]
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Personal data: mounted read-only at run time, never baked into the image.
      - ./collector/profile.md:/app/profile.md:ro

  # Same image again: splits new jobs into chunks and stores their embeddings.
  # Runs locally, no API key. Start it with `docker compose run --rm embedder`.
  embedder:
    build: ./collector
    image: radar-collector
    command: ["python", "embedder.py"]
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  pgdata:
  n8n_data:
